<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>FirstStep – first job after MNU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#16204A;--ink2:#4A5376;--mute:#8A90A8;--line:#E3E6EF;
  --bg:#EEF0F6;--card:#FFFFFF;--navy:#1C2C74;--navy2:#2B3F9E;--sun:#FFC43D;--sunInk:#5A4100;
  --ok:#1F8A5B;--okbg:#E4F4EC;--no:#B3372F;--nobg:#FBE8E6;--wait:#6B5BD2;--waitbg:#EEEBFC;
  --chip:#F3F4F9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EEF0FA;--ink2:#B6BCD6;--mute:#8088A6;--line:#2A3150;--bg:#0E1330;--card:#171D40;--navy:#8FA2FF;--navy2:#A9B8FF;
  --sun:#FFC43D;--sunInk:#3A2A00;--okbg:#153828;--ok:#6FD3A3;--nobg:#3A1A18;--no:#F29A92;--waitbg:#262054;--wait:#B6ABFF;--chip:#20274F}}
:root[data-theme="dark"]{--ink:#EEF0FA;--ink2:#B6BCD6;--mute:#8088A6;--line:#2A3150;--bg:#0E1330;--card:#171D40;--navy:#8FA2FF;--navy2:#A9B8FF;
  --sun:#FFC43D;--sunInk:#3A2A00;--okbg:#153828;--ok:#6FD3A3;--nobg:#3A1A18;--no:#F29A92;--waitbg:#262054;--wait:#B6ABFF;--chip:#20274F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px}
.phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 48px));background:var(--bg);border-radius:34px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:480px){.stage{padding:0;height:100%}.phone{max-width:none;height:100%;border-radius:0;border:0}}
.top{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.back{border:0;background:var(--card);width:36px;height:36px;border-radius:12px;font-size:18px}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-weight:600;display:grid;place-items:center;flex:none}
.scroll{flex:1;overflow-y:auto;padding:0 16px 20px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--navy);color:#fff;width:100%}
:root[data-theme="dark"] .btn{color:#0E1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1330}}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{width:auto;padding:9px 13px;font-size:13px;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--mute);font-size:13px}
.h2{font-size:17px;font-weight:600;margin:18px 4px 10px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2)}
.match{background:var(--sun);color:var(--sunInk)}
input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:13px 14px;font:inherit}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font-size:14px}
.opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
/* welcome */
.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 26px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .hero{background:#1C2C74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1C2C74}}
.steps{display:flex;gap:6px;margin-bottom:auto;padding-top:18px}
.steps span{height:10px;border-radius:3px;background:rgba(255,255,255,.18)}
.hero h2{font-size:38px;line-height:1.02;letter-spacing:-.03em;margin:0 0 12px;font-weight:700}
.hero p{margin:0 0 20px;color:#C9D0F2;max-width:30ch}
.hero .form{background:var(--card);color:var(--ink);border-radius:22px;padding:16px}
.hero .form label{font-size:13px;color:var(--mute);display:block;margin:0 0 6px}
.err{color:var(--no);font-size:13px;margin-top:6px;min-height:0}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px}
.msg.ai{background:var(--card);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--navy);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
:root[data-theme="dark"] .msg.me{color:#0E1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.me{color:#0E1330}}
.dir{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dir:first-of-type{border-top:0}
.bar{height:6px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun)}
.composer{display:flex;gap:8px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line)}
.composer input{padding:11px 13px}
.composer .btn{width:auto}
.pw{white-space:pre-wrap}
a.site{display:inline-block;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--navy);text-decoration:none}
:root[data-theme="dark"] a.site{color:#9DB0FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a.site{color:#9DB0FF}}
.face.photo{position:relative;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.face.photo.big{width:68px;height:68px;font-size:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.face .dot{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#2ECC71;border:2px solid var(--card)}
.card.pro{background:linear-gradient(135deg,#3B5BDB,#2B3F9E);color:#fff}
.opt.fmt{display:block;width:100%;text-align:left;margin-bottom:8px}
.opt[disabled]{opacity:.45;pointer-events:none}
.pill.ok{background:#E4F4EC;color:#1F7A4F}
.nav button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#E5322D;color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center}
.card.notif{background:#FFF6DB;color:#5A4300}
.card.hint{background:var(--chip)}
.sortsel{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px}
.why{margin-top:6px;font-size:12.5px;color:#1F7A4F;background:#E9F7EF;border-radius:10px;padding:6px 10px}
.card.alink{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}
.tour-bg{position:fixed;inset:0;background:rgba(15,20,50,.55);display:grid;place-items:end center;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px));z-index:50}
.tour{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.step{background:var(--chip);border-radius:10px;padding:5px 9px;font-size:13px}
.step.last{background:#1E2A6E;color:#fff;font-weight:600}
.arr{color:var(--muted)}
.lnk{border:0;background:none;color:var(--navy);font:inherit;font-size:13px;padding:2px 6px;cursor:pointer}
/* jobs */
.job .co{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.job h3{margin:0;font-size:15.5px;font-weight:600}
.job .acts{display:flex;gap:8px;margin-top:12px}
.job .acts .btn{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px}
.tabs button{border:0;background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
/* tracker */
.big{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}
.st{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px}
.st.Applied{background:var(--chip);color:var(--ink2)}
.st.Viewed{background:var(--waitbg);color:var(--wait)}
.st.Interview{background:#FFF1CC;color:#6A4B00}
.st.Offer{background:var(--okbg);color:var(--ok)}
.st.Rejected{background:var(--nobg);color:var(--no)}
.pipe{display:flex;gap:4px;margin-top:14px}
.pipe div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.pipe b{display:block;font-size:18px;color:var(--ink)}
.trk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trk:first-child{border-top:0}
/* mentors */
.ment{display:flex;gap:12px}
.face{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,40,.45);display:none;align-items:flex-end;z-index:5}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:6;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hr-head{display:flex;gap:10px;align-items:center}
.home-cta{background:var(--navy);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
:root[data-theme="dark"] .home-cta{background:#1C2C74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .home-cta{background:#1C2C74}}
.home-cta p{margin:6px 0 14px;color:#C9D0F2;font-size:14px}
.home-cta .btn{background:var(--sun);color:var(--sunInk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:0;border-radius:18px;padding:14px;text-align:left}
.tile b{display:block;font-size:15px;margin-bottom:3px}
.field{padding:10px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field .muted{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.src{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--ink2);margin-left:6px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;align-self:flex-start}
.lang button{border:0;background:none;color:#C9D0F2;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600}
.lang button.on{background:#fff;color:#1C2C74}
.lang.dark{background:var(--chip)}.lang.dark button{color:var(--ink2)}.lang.dark button.on{background:var(--navy);color:#fff}
.sal{font-weight:600;font-size:14px;margin-top:8px}
.why{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.prog{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin:4px 0 2px}.prog i{display:block;height:100%;background:var(--navy)}
.verified{color:var(--ok);font-weight:600}
.note{font-size:12.5px;color:var(--mute);text-align:center;padding:8px 12px}
select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:12px;font:inherit}
.lbl{font-size:13px;color:var(--mute);display:block;margin:10px 0 6px}
.filebox{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;display:block;cursor:pointer}
.trk{cursor:pointer}
</style>
</head>

function ensureChat(){if(!S.chat.length)S.chat.push({a:1,k:"hello"});}
function renderMsg(m){

 if(m.k==="result")return `<div class="msg ai" style="max-width:92%">${resultHtml()}</div>`;

 if(m.k==="int")return `<div class="msg ai" style="max-width:92%"><div style="font-weight:600;margin-bottom:6px">${T("mockT")}</div><div>1. ${T("mq1")}</div><div>2. ${esc(T("mq2")(S.dir||T("thisField")))}</div><div>3. ${T("mq3")}</div><div class="muted" style="margin-top:8px">${T("star")}</div></div>`;
 if(m.k==="def")return `<div class="msg ai">${T("aiDefault")}</div>`;
 if(m.k==="qa")return `<div class="msg me">${esc(QUIZ[S.lang][m.q][1][m.o])}</div>`;
 if(m.k==="btn")return `<div class="msg me">${esc(T(m.t))}</div>`;
 return `<div class="msg ${m.a?"ai":"me"} pw"${m.id?` id="${m.id}"`:""}>${m.t?esc(m.t):'<span class="muted">…</span>'}</div>`;}
function resultHtml(){const d=S.dirs;
 return `<div style="margin-bottom:8px">${T("top3")}</div>`+d.map(x=>`<div class="dir"><div style="flex:1"><div style="font-weight:600">${x.n}</div><div class="bar"><i style="width:${x.m}%"></i></div></div><span class="pill match" style="margin-left:12px">${x.m}%</span></div>`).join("")+
 `<div class="why"><b>${T("whyT")}:</b> ${esc(T("why")(S.program,T("tr")[d.t1],d.c1,T("tr")[d.t2],d.c2))}</div><button class="btn sm" style="margin-top:10px" onclick="go('jobs')">${T("seeJobs")}</button>`;}
function ai(){ensureChat();
 let tail="";
 if(S.quizOn){const Q=QUIZ[S.lang][S.q];
  tail=`<div class="msg ai" style="max-width:92%"><div class="muted">${T("qOf")(S.q+1,6)}</div><div class="prog"><i style="width:${(S.q)/6*100}%"></i></div><div style="font-weight:600;margin-top:6px">${Q[0]}</div></div>
  <div class="opts">${Q[1].map((o,i)=>`<button class="opt" onclick="answer(${i})">${esc(o)}</button>`).join("")}</div>`;}
 else if(!S.dirs)tail=`<div class="opts"><button class="opt sel" onclick="startQuiz()">${T("startQuiz")}</button></div>`;
 else tail=`<div class="opts"><button class="opt" onclick="aiQuick('cv')">${T("improveCv")}</button><button class="opt" onclick="aiQuick('int')">${T("prep")}</button><button class="opt" onclick="go('jobs')">${T("findInt")}</button><button class="opt" onclick="startQuiz()">${T("retake")}</button></div>`;
 return frame(topBar(T("aiTitle"))+`<div class="scroll" id="chatScroll"><div class="chat">${S.chat.map(renderMsg).join("")}${tail}</div></div>
 <div class="composer"><input id="ask" placeholder="${T("ask")}" onkeydown="if(event.key==='Enter')sendAi()"><button class="btn sm" onclick="sendAi()">${T("send")}</button></div>`+nav());}
function startQuiz(){ensureChat();S.quizOn=true;S.q=0;S.answers=[];go("ai");}
function answer(i){S.chat.push({k:"qa",q:S.q,o:i});S.answers.push(TRAITS[i]);S.q++;
 if(S.q>=6){S.quizOn=false;computeDirs();S.chat.push({a:1,k:"result"});
  if(AI){askAI("The student just finished a 6-question interest quiz and the app showed their top 3 career directions. In 3-4 sentences, explain why the top direction fits their program and answers, and suggest one concrete first step they can take this week in Astana.");return;}}
 render();}
function computeDirs(){const cnt={A:0,P:0,N:0,W:0};S.answers.forEach(t=>cnt[t]++);
 const list=(DIRS[S.program]||DIRS.Other).map(([n,t1,t2])=>({n,m:Math.min(96,52+cnt[t1]*7+cnt[t2]*4)})).sort((a,b)=>b.m-a.m).slice(0,3);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
 list.t1=top[0][0];list.c1=top[0][1];list.t2=top[1][0];list.c2=top[1][1];
 S.dirs=list;S.dir=list[0].n;}

/* own website: real AI through the Netlify function */
async function remoteAI(prompt,opts){const r=await fetch("/.netlify/functions/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.text)throw {text:null};if(opts&&opts.onText)opts.onText({text:j.text});return {text:j.text};}
if(!(window.claude&&window.claude.use)){fetch("/.netlify/functions/ai").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok)AI=remoteAI;}).catch(()=>{});}

async function askAI(task){
 const msg={a:1,t:"",live:1,id:"m"+Date.now()};S.chat.push(msg);busy=true;render();
 const lang=S.lang==="ru"?"Russian":"English";
 const prompt=`You are FirstStep, an AI career assistant for graduates of Maqsut Narikbayev University (MNU) in Astana, Kazakhstan, who are looking for their first job without work experience. Be friendly, practical and specific to Kazakhstan (hh.kz, Enbek.kz, LinkedIn, Astana Hub, internships at local companies). Never invent experience the student does not have. Reply in ${lang} unless the student writes in another language. Plain text only: no markdown, no asterisks, no headings; use short paragraphs or numbered lines. Keep it under 150 words.\n\nPersonalize every answer: use the student's program, skills, experience and goal from the profile, and when relevant name 1-2 specific roles from the FirstStep jobs list below. Avoid generic advice; if key info is missing, ask one short question about it.\n\nStudent profile: ${profileTxt()}\n\nFirstStep jobs: ${JOBS.map(j=>j.role+" at "+j.co+" ("+j.type+", "+j.dir+(j.noexp?", no experience needed":"")+", "+j.sal+")").join("; ")}\n\nConversation so far:\n${transcript()||"(none)"}\n\nTask: ${task}`;
 try{const r=await AI(prompt,{cache:false,onText:({text})=>{msg.t=text;const el=document.getElementById(msg.id);if(el)el.textContent=text;const sc=document.querySelector(".scroll");if(sc)sc.scrollTop=sc.scrollHeight;}});msg.t=(r&&r.text)||msg.t;}
 catch(e){msg.t=(e&&e.text)||(S.lang==="ru"?"Не получилось ответить. Попробуйте ещё раз.":"Something went wrong. Please try again.");}
 msg.live=0;busy=false;if(S.screen==="ai")render();}
function aiTailor(jid){const j=JOBS.find(x=>x.id===jid);ensureChat();S.chat.push({t:T("tailorMsg")(j.role,j.co)});S.screen="ai";
 if(!AI){S.chat.push({a:1,k:"def"});render();return;}
 askAI(`The student wants a CV version tailored to "${j.role}" at ${j.co} (${j.dir}, ${j.type}). Using their profile, write a short tailored CV summary (2 sentences) and 4 bullet lines that match this role, then list 3 keywords from this kind of vacancy they should include. Mention they can save it as a separate CV version for this job.`);}
function aiQuick(k){if(busy)return;ensureChat();S.chat.push({k:"btn",t:k==="cv"?"improveCv":"prep"});
 if(!AI){S.chat.push({a:1,k});go("ai");return;}
 S.screen="ai";
 askAI(k==="cv"?"The student tapped 'Improve my CV'. Give 3 concrete fixes for a first CV based on their program and direction (how to present MNU projects, moot courts, case competitions, clubs and volunteering as experience, with one example line), then ask them to paste their CV text or describe their experience so you can rewrite it.":"The student tapped 'Prepare for interview'. Start a mock interview for an entry-level role in their direction. In one sentence explain the format (3 questions, short feedback after each answer, use the STAR method), then ask ONLY the first question and wait.");}
function sendAi(){if(busy)return;const v=$("#ask").value.trim();if(!v)return;S.chat.push({t:v});
 if(AI){askAI("Respond to the student's last message. If a mock interview is in progress, give short feedback on their answer (what was good, what to improve) and ask the next question; after the third answer give an overall score out of 10 and two tips. If they pasted a CV or described their experience, rewrite it as a clean first-job CV.");return;}
 S.chat.push({a:1,k:"def"});render();}
function aiQuick_old(k){ensureChat();S.chat.push({k:"btn",t:k==="cv"?"improveCv":"prep"});S.chat.push({a:1,k});go("ai");}
function sendAi_old(){const v=$("#ask").value.trim();if(!v)return;S.chat.push({t:v});S.chat.push({a:1,k:"def"});render();}

function hr(){const j=JOBS.find(x=>x.id===S.hrJob);const m=S.hrMsgs[j.id];
 return frame(`<div class="top"><button class="back" onclick="go('jobs')" aria-label="Back">‹</button><div class="hr-head" style="flex:1"><div class="logo" style="background:${j.c};width:38px;height:38px">${j.hr[0]}</div><div><div style="font-weight:600">${esc(j.hr)}</div><div class="muted"><span class="verified">✓ ${T("verified")}</span>, ${esc(j.co)}</div><div class="muted">${T("answers")(j.rr)}, ~${j.rt}d</div>${j.web?`<a class="site" href="${j.web}" target="_blank" rel="noopener">${T("site")} ↗</a>`:""}</div></div></div>
 <div class="scroll"><div class="chat"><div class="msg ai">${esc(T("hrHello")(j.role))}</div>
 ${m.map(x=>x.a?`<div class="msg ai pw"${x.id?` id="${x.id}"`:""}>${x.t?esc(x.t):(x.live?'<span class="muted">'+T("typing")+'</span>':esc(T("hrReply")))}</div>`:`<div class="msg me">${esc(x.t)}</div>`).join("")}
 ${m.length?"":`<div class="opts"><button class="opt" onclick="hrSend(T('hrQ1'))">${T("hrQ1")}</button><button class="opt" onclick="hrSend(T('hrQ2'))">${T("hrQ2")}</button></div>`}
 <div class="note">${T("hrNote")}</div>
 </div></div>

function hrSend(t){if(S.hrBusy)return;const v=t||$("#hrIn").value.trim();if(!v)return;const id=S.hrJob;const j=JOBS.find(x=>x.id===id);S.hrMsgs[id].push({t:v});
 const msg={a:1,t:"",live:1,id:"h"+Date.now()};S.hrMsgs[id].push(msg);S.hrBusy=true;render();
 const done=()=>{msg.live=0;S.hrBusy=false;if(S.screen==="hr"&&S.hrJob===id)render();else save();};
 if(!AI){setTimeout(()=>{msg.t=hrFallback(v,j,id);done();},1100);return;}
 const hist=S.hrMsgs[id].filter(x=>!x.live).slice(-12).map(x=>(x.a?"HR: ":"Candidate: ")+(x.t||T("hrReply"))).join("\n");
 const lang=S.lang==="ru"?"Russian":"English";
 const prompt=`You are ${j.hr}, an HR specialist at ${j.co} in Astana, Kazakhstan, chatting with a recent MNU graduate inside the FirstStep app about the "${j.role}" position (${j.type==="Job"?"full-time job":"internship"}, ${j.dir}, salary ${j.sal} per month, you usually reply within ${j.rt} days). Candidate profile: name ${S.name||"-"}, MNU program ${S.program||"-"}, has applied: ${S.apps.some(a=>a.jid===id)?"yes":"not yet"}.
Reply like a real, friendly HR person: 1-3 short sentences, natural, specific to what the candidate just asked, never repeat a previous reply word for word. You can talk about tasks of the role, selection steps (CV review, test task, interview), schedule, what juniors learn, and what helps a graduate without experience stand out. Do not promise a job offer and do not invent exact facts about the company you cannot know; if unsure, say you will check. If it fits, suggest applying through the profile or looking at the company website ${j.web||""}. Reply in ${lang} unless the candidate writes in another language. Plain text only, no markdown.
Chat so far:
${hist}
Write only your next reply as ${j.hr}.`;
 AI(prompt,{cache:false,onText:({text})=>{msg.t=text;const el=document.getElementById(msg.id);if(el)el.textContent=text;}}).then(r=>{msg.t=(r&&r.text)||msg.t||hrFallback(v,j,id);done();}).catch(e=>{msg.t=(e&&e.text)||hrFallback(v,j,id);done();});}
function hrFallback(v,j,id){const s=v.toLowerCase(),ru=S.lang==="ru";const n=S.hrMsgs[id].filter(x=>x.a&&!x.live).length;
 const has=(...w)=>w.some(x=>s.includes(x));
 if(has("опыт","experience","без опыт"))return ru?`Да, на позицию ${j.role} мы рассматриваем выпускников без опыта. Нам важнее учебные проекты, стажировки и мотивация.`:`Yes, for ${j.role} we consider graduates without experience. Projects, internships and motivation matter more to us.`;
 if(has("отбор","этап","собесед","process","interview","selection","steps"))return ru?"Отбор в 3 шага: просмотр резюме, небольшое тестовое задание и интервью с руководителем. Обычно всё занимает 2–3 недели.":"Selection has 3 steps: CV review, a short test task and an interview with the team lead. It usually takes 2–3 weeks.";
 if(has("зарплат","оклад","деньг","salary","pay"))return ru?`Вилка на старте — ${j.sal} в месяц, после испытательного срока пересматриваем.`:`The starting range is ${j.sal} per month, reviewed after probation.`;
 if(has("график","удален","офис","schedule","remote","office"))return ru?"Работаем в офисе в Астане, 5/2, с 9:00 до 18:00. Иногда можно 1 день из дома.":"We work from our Astana office, 5 days a week, 9 to 6. Sometimes 1 day from home is possible.";
 if(has("задач","обязан","что делать","tasks","duties","responsib"))return ru?"На старте — помощь команде с документами и анализом, потом свои небольшие проекты. Будет наставник.":"At first you'll support the team with documents and analysis, then get small projects of your own. You'll have a mentor.";
 if(has("спасибо","thank"))return ru?"Пожалуйста! Будут вопросы — пишите, я на связи.":"You're welcome! Write if you have more questions.";
 const g=ru?["Хороший вопрос! Уточню у команды и вернусь с ответом в течение пары дней.","Откликнитесь через профиль и укажите проекты в MNU – я посмотрю на этой неделе.",`Подробнее о компании можно почитать на нашем сайте, а по позиции ${j.role} спрашивайте здесь.`]:["Good question! I'll check with the team and get back to you in a couple of days.","Apply with your profile and mention your MNU projects – I'll review it this week.",`You can read more about us on our website, and ask me anything about the ${j.role} role here.`];
 return g[n%g.length];}

const DIRKW={Law:["law","legal","moot","contract","court","юрид","прав","муткорт","договор","суд"],Business:["marketing","project","management","sales","smm","case","маркет","проект","менедж","продаж","кейс"],Economics:["excel","finance","financial","data","sql","statistic","эконом","финанс","аналит","статист"],Other:["hr","people","communication","recruit","коммуник","персонал"]};
const JTR={j1:"W",j2:"A",j3:"N",j4:"A",j5:"P",j6:"A",j7:"P",j8:"P",j9:"N"};
const JKW={j1:["english","writing","contract","договор","англ"],j2:["excel","sql","analysis","data","анализ","it"],j3:["excel","finance","finans","финанс"],j4:["english","compliance","regulation","англ"],j5:["project","organiz","event","проект","организ","мероприят"],j6:["research","statistic","excel","исслед","статист"],j7:["people","communication","hr","люд","коммуник"],j8:["smm","marketing","content","canva","маркет","контент"],j9:["excel","audit","accounting","аудит","бух"]};
function matchOf(j){const why=[];let m=45;const ru=S.lang==="ru";
 if(j.dir===S.program){m+=22;why.push(T("wProg")(j.dir));}else if(j.dir==="Other"||S.program==="Other")m+=8;
 if(S.dirs){if(JTR[j.id]===S.dirs.t1){m+=14;why.push(T("wQuiz")(T("tr")[S.dirs.t1]));}else if(JTR[j.id]===S.dirs.t2){m+=7;why.push(T("wQuiz")(T("tr")[S.dirs.t2]));}}
 const txt=((S.skills||"")+" "+(S.exp||"")).toLowerCase();
 if(txt.trim()){const hits=[...new Set([...(JKW[j.id]||[]),...(DIRKW[j.dir]||[])].filter(k=>txt.includes(k)))];if(hits.length){m+=Math.min(12,hits.length*5);why.push(T("wSkills"));}}
 const g=(S.goal||"").toLowerCase();
 if(g&&((j.type==="Internship"&&/(intern|стаж)/.test(g))||j.role.toLowerCase().split(" ").some(w=>w.length>3&&g.includes(w))||(DIRKW[j.dir]||[]).some(k=>g.includes(k)))){m+=6;why.push(T("wGoal"));}
 if(j.noexp&&!(S.exp||"").trim()){m+=5;why.push(T("wNoExp"));}
 return {m:Math.max(35,Math.min(97,m)),why:why.slice(0,3)};}
